<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Dungeon Maze Progression</title>
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="hud">
    <div class="stat">Level: <span id="level-num">1</span></div>
    <div class="stat">Maze Size: <span id="maze-size">7x7</span></div>
    <div class="stat">Hazards: <span id="hazard-status">None</span></div>
    <div class="controls-hint">Move: <b>WASD / Arrows</b> | Reach the Green Portal</div>
  </div>

  <div id="banner" class="hidden">
    <h1 id="banner-title">Level Complete!</h1>
    <p id="banner-sub">Preparing next floor...</p>
  </div>

  <div id="game-container"></div>

  <script type="module" src="./main.js"></script>
</body>
</html>
